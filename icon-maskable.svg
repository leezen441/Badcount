<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2025" />
      <stop offset="100%" stop-color="#0f1013" />
    </linearGradient>
  </defs>
  <!-- Fully filled background for maskable compatibility -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <g transform="scale(0.82) translate(46, 46)">
    <g fill="url(#limeGrad)">
      <!-- Racket Handle (Thick diagonal line) -->
      <path d="M 110 390 L 190 310" stroke="url(#limeGrad)" stroke-width="45" stroke-linecap="round" fill="none" />
      <!-- Racket Head (Solid Circle) -->
      <circle cx="246" cy="266" r="90" />
      <!-- Shuttlecock (Abstract shape flying top-right) -->
      <g transform="translate(348, 164) rotate(45)">
        <!-- Cork base -->
        <path d="M -30 40 A 30 30 0 0 1 30 40 Z" />
        <!-- Feathers -->
        <path d="M -60 -60 L -30 20 L 30 20 L 60 -60 L 0 -30 Z" />
      </g>
    </g>
  </g>
</svg>
